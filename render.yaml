services:
  - type: web
    name: connektly-webhook
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: VITE_FACEBOOK_APP_ID
        sync: false
      - key: VITE_FACEBOOK_CONFIG_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
